<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcefef">
  <title>Hộp Quà 20/10</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme:light; --bg:#fcefef;--surface:#fff8f7;--fg:#3b1020;--muted:#8a5565;--accent:#c2185b;--accent-fg:#fff8f7;--gold:#a87418;--line:#ecccd2;--display:'Playfair Display',Georgia,serif;--body:'Be Vietnam Pro',system-ui,sans-serif; }
    @media (prefers-color-scheme: dark) { :root { color-scheme:dark;--bg:#280a17;--surface:#361425;--fg:#fbe8ec;--muted:#c79aa8;--accent:#f27ca2;--accent-fg:#2a0a17;--gold:#e6bc63;--line:#552838; } }
    * { box-sizing:border-box } [hidden] { display:none!important }
    body { margin:0; background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6; padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(40px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
    .wrap { max-width:440px;min-width:0; margin:0 auto;display:flex;flex-direction:column;gap:20px; }
    .eyebrow { font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold); }
    h1 { font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,46px);line-height:1.12;margin:6px 0 0;text-wrap:balance; }
    h1 em { font-weight:500;color:var(--accent); }
    .stage { display:flex;justify-content:center;padding:4px 0; }
    #gift { display:block;width:min(100%,260px);height:auto;overflow:visible;cursor:pointer;outline-offset:6px; -webkit-tap-highlight-color:transparent; }
    #gift:focus-visible {outline:3px solid var(--gold);border-radius:8px;}
    .lid { transform-box:fill-box;transform-origin:0% 100%;transition:transform .55s cubic-bezier(.3,1.4,.5,1); }
    #gift.open .lid { transform:translate(-14px,-52px) rotate(-14deg); }
    .glow {opacity:0;transition:opacity .4s .1s;}
    #gift.open .glow {opacity:1;}
    #gift:not(.open) {animation:nudge 3.2s ease-in-out infinite;}
    @keyframes nudge {0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-2.5deg)}96%{transform:rotate(2.5deg)}}
    .who {display:flex;flex-direction:column;gap:6px;}
    label {font-size:13px;font-weight:500;color:var(--muted)}
    input {width:100%;min-width:0;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;}
    input:focus-visible {outline:3px solid var(--gold);outline-offset:1px;}
    button {border-radius:999px;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-fg);padding:13px 22px;font:inherit;font-weight:600;cursor:pointer;transition:transform .15s ease;}
    button:active {transform:scale(.97)} button:focus-visible{outline:3px solid var(--gold);outline-offset:3px} button:disabled {opacity:.7;cursor:wait}
    .note {font-size:13px;color:var(--muted);min-height:1.4em;margin:0;}
    #privacy {font-size:11px;line-height:1.6;}
    .card {border:1px solid var(--line);border-radius:14px;padding:24px 22px 20px;background:var(--surface);display:flex;flex-direction:column;gap:14px;animation:rise .55s .25s both cubic-bezier(.2,.8,.2,1)}
    @keyframes rise {from {opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .tag {align-self:flex-start;color:var(--gold);border:1px solid var(--gold);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;}
    .to {font-family:var(--display);font-style:italic;color:var(--accent);font-size:19px;margin:0;overflow-wrap:anywhere;}
    .wish {font:500 clamp(21px,6vw,25px)/1.45 var(--display);margin:0;white-space:pre-line;text-wrap:pretty;overflow-wrap:anywhere;}
    .bouquet {margin:6px 0 0;} .bouquet svg {display:block;width:100%;height:auto;} .bouquet-photo{display:block;width:100%;height:auto;border-radius:18px;box-shadow:0 10px 24px rgba(0,0,0,.12);object-fit:cover;}
    .bouquet-title {font:italic 21px/1.4 var(--display);color:var(--accent);text-align:center;margin:14px 0 5px;overflow-wrap:anywhere;}
    .bouquet-caption {font-size:12px;text-align:center;color:var(--muted);margin:0;}
    .sign {margin:0;border-top:1px solid var(--line);padding-top:12px;font-size:13px;color:var(--muted)}
    .petals {position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
    @media (prefers-reduced-motion:reduce) {#gift:not(.open){animation:none}.lid,.glow{transition:none}.card{animation:none}}
  </style>
</head>

  <script>
    (() => {
      const $ = id => document.getElementById(id);
      const input = $('name'), gift = $('gift'), btn = $('open'), card = $('card');
      let opened = false;
      const prefersLessMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      // Có thể gửi link dạng: https://.../index.html#Tên-người-nhận
      try {
        const fromLink = decodeURIComponent(location.hash.slice(1)).replace(/[._~-]+/g,' ').trim();
        if (fromLink) input.value = fromLink.slice(0,24);
      } catch (_) {}

      const messages = [
        'Chúc bạn luôn được yêu thương, trân trọng và mỉm cười thật nhiều. Mong mỗi ngày đều mang đến cho bạn những điều dịu dàng nhất.',
        'Mong rằng mỗi ngày của bạn đều ngập tràn hoa, nắng và những niềm vui nho nhỏ. Chúc bạn một ngày 20/10 thật đặc biệt!',
        'Chúc bạn luôn tự tin, hạnh phúc và rực rỡ theo cách riêng của mình. Những điều tốt đẹp nhất đang chờ bạn phía trước.',
        'Bạn xứng đáng với sự quan tâm, niềm vui và những điều đẹp đẽ nhất. Chúc ngày 20/10 của bạn thật ngọt ngào!',
        'Cảm ơn vì đã luôn là một phiên bản tuyệt vời của chính mình. Mong bạn bình an, hạnh phúc và được yêu thương thật nhiều.',
        'Mong mọi ước mơ của bạn sẽ dần thành hiện thực, và dù bận rộn đến đâu, bạn vẫn luôn có lý do để mỉm cười.',

      const tagNames = ['Một chút yêu thương','Dành riêng cho bạn','Điều ước dịu dàng','Hôm nay thật đặc biệt','Lời chúc từ trái tim'];
      const colors = ['#e7a0ad','#e6b963','#b8a6d5','#e59678','#90b8cf','#c58cac','#e6c5bc'];
      const safe = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const lettersOf = name => name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').replace(/[^a-z]/gi,'').toUpperCase().slice(0,24) || 'FLOWER';
      function seedFrom(text) { let h=2166136261;for (const char of text) h=Math.imul(h^char.charCodeAt(0),16777619);return h>>>0; }
      function randomFrom(seed) {return function(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)/4294967296;};}
      function flowerSvg(letter,r) {
        const val=letter.charCodeAt(0)-65;
        const color=colors[val%colors.length];
        const type=val%5;
        let petals='';
        if (type===0) {
          for(let i=0;i<9;i++)petals+=`<ellipse cx="0" cy="-12" rx="4.7" ry="10" transform="rotate(${i*40})"/>`;
        } else if(type===1) {
          for(let i=0;i<6;i++)petals+=`<path d="M0 0C-20 -15 -13 -24 0 -25C13 -24 20 -15 0 0Z" transform="rotate(${i*60})"/>`;
        } else if(type===2) {
          for(let i=0;i<5;i++)petals+=`<path d="M0 5C-16 -4 -24 -19 -7 -23Q5 -27 10 -17Q16 -5 0 5Z" transform="rotate(${i*72})"/>`;
        } else if(type===3) {
          petals='<path d="M-20 -12Q-27 14 0 18Q27 14 20 -12L8 -5 0 -21 -8 -5Z"/><path d="M-8 -5Q-9 8 0 18M8 -5Q9 8 0 18" fill="none" stroke="#82646b" stroke-width=".8"/>';
        } else {
          for(let i=0;i<8;i++)petals+=`<ellipse cx="0" cy="-13" rx="3.7" ry="9" transform="rotate(${i*45})"/>`;
        }
        const center=type===3?'':`<circle r="${type===2?5:5.8}" fill="#efd17c" stroke="#82646b" stroke-width=".7"/>`;
        return `<g fill="${color}" stroke="#82646b" stroke-width=".85" stroke-linejoin="round">${petals}${center}</g>`;
      }
      function drawBouquet(name) {
        $('personal-flower-photo').alt=`Bó hoa hồng dành riêng cho ${name}`;
        $('bouquet-title').textContent=`Một bó hoa dành cho ${name}`;
      }
      function openBox() {
        if(opened)return;
        const name=input.value.trim().slice(0,24);
        if(!name){$('status').textContent='Bạn nhập tên trước khi mở hộp nhé 🌷';input.setAttribute('aria-invalid','true');input.focus();return;}
        input.removeAttribute('aria-invalid');
        opened=true;input.disabled=true;
        btn.disabled=true;$('status').textContent='Đang mở lời chúc…';gift.classList.add('open');
        setTimeout(()=>{
          const seed=seedFrom(lettersOf(name));
          $('tag').textContent=tagNames[seed%tagNames.length];
          $('to').textContent=`Gửi ${name},`;
          $('wish').textContent=messages[seed%messages.length];
          drawBouquet(name);
          card.hidden=false;$('status').textContent='';btn.hidden=true;
          gift.removeAttribute('tabindex');gift.removeAttribute('role');gift.setAttribute('aria-label','Hộp quà đã mở');gift.style.cursor='default';
          burstPetals();
        },prefersLessMotion?0:450);
      }
      btn.addEventListener('click',openBox);
      gift.addEventListener('click',openBox);
      gift.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openBox();}});
      input.addEventListener('keydown',e=>{if(e.key==='Enter')openBox();});
      input.addEventListener('input',()=>{$('status').textContent='';input.removeAttribute('aria-invalid');});

      function burstPetals() {
        const cv=$('petals'),ctx=cv.getContext('2d');if(prefersLessMotion||!ctx)return;
        const ratio=Math.min(window.devicePixelRatio||1,2);
        const width=cv.width=innerWidth*ratio,height=cv.height=innerHeight*ratio;
        const shades=['#c2185b','#e6bc63','#f7b4c8','#e99aa9','#e7a0ad'];
        const pieces=Array.from({length:55},(_,i)=>({x:width*(.35+Math.random()*.3),y:height*.28,vx:(Math.random()-.5)*8*ratio,vy:-(Math.random()*5+1)*ratio,angle:Math.random()*6.28,spin:(Math.random()-.5)*.15,size:(Math.random()*5+5)*ratio,color:shades[i%shades.length]}));
        const start=performance.now();
        function frame(now){let age=now-start;ctx.clearRect(0,0,width,height);
          for(const p of pieces){p.vy+=.14*ratio;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.angle+=p.spin;
            ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.globalAlpha=Math.max(0,1-age/4200);ctx.fillStyle=p.color;ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*.53,0,0,Math.PI*2);ctx.fill();ctx.restore();}
          if(age<4200)requestAnimationFrame(frame);else ctx.clearRect(0,0,width,height);
        }
        requestAnimationFrame(frame);
      }
    })();
  </script>
